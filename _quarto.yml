project:
  type: website
  resources: # here we need to add any files that users should be able to download
    - files/cv.pdf

website:
  title: "Jane Stephenson" # website title, this is what's displayed on the top
  navbar: # Options for website navigation (including bar). For alternatives see https://quarto.org/docs/websites/website-navigation.html
    left: # links displayed in navigation bar
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research 
      - href: teaching.qmd
        text: Experience
      - href: code.qmd
        text: Resources
      - href: more_science.qmd
        text: More Science!
    search: false


# Formatting. For more options see https://quarto.org/docs/output-formats/html-basics.html 
format:
  html:
    page-layout: full
    fontsize: 100%
    linestretch: 1.5
    theme: [minty, custom.scss] # minty fonts + custom color palette (see custom.scss)
    css: styles.css # custom file to adjust some css options 
    toc: true
    anchor-sections: false



